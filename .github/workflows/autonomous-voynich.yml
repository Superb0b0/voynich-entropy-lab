name: Voynich autonomous research (guarded)
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'
permissions:
  contents: read
concurrency:
  group: voynich-autonomous-research
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify input hashes and holdout guard
        run: python tools/research_guard.py
      - name: Check AI credentials without exposing value
        id: key
        env:
          KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: echo "ready=$KEY_PRESENT" >> "$GITHUB_OUTPUT"
      - name: No API key configured
        if: steps.key.outputs.ready != 'true'
        run: echo 'No OPENAI_API_KEY configured. Safe no-op. ChatGPT Plus does not provide API billing.'
      - name: Autonomous research candidate (no network, no GitHub write)
        if: steps.key.outputs.ready == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: tools/research-agent-prompt.md
      - name: Verify protected files unchanged
        if: steps.key.outputs.ready == 'true'
        run: |
          python tools/research_guard.py
          if git diff --name-only | grep -E '^(HOLDOUT.md|MANIFEST.md|data/|anchor/|PROTOCOL.md|\.github/workflows/)'; then
            echo 'Protected file modified'; exit 1
          fi
      - name: Upload reviewable candidate patch, never auto-merge
        if: steps.key.outputs.ready == 'true'
        run: |
          git diff --binary > research-candidate.patch
          git status --short > research-candidate-status.txt
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: voynich-research-candidate
          path: |
            research-candidate.patch
            research-candidate-status.txt
          retention-days: 30
