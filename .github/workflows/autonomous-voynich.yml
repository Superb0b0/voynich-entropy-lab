name: Voynich free scheduled research checks
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'
permissions:
  contents: read
concurrency:
  group: voynich-free-checks
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrity check
        run: python tools/research_guard.py
      - name: Run fixed exploratory tests on training only
        run: python tools/free_research_cycle.py
      - name: Exploratory qo rival calibration (preregistered)\n        run: python tools/qo_rival_calibration.py\n      - name: Archive results (no commits, no API, no paid service)
        uses: actions/upload-artifact@v4
        with:
          name: voynich-free-exploratory-${{ github.run_number }}
          path: research-output/
          retention-days: 30
