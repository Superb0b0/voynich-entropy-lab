name: QO isolated training replay
on:
  push:
    branches: [research/qo-isolated-replay-20261116]
    paths:
      - '.github/workflows/qo-isolated.yml'
      - 'tools/qo_mech_01.py'
      - 'research/qo-mech-01-protocol.md'
  pull_request:
    paths:
      - '.github/workflows/qo-isolated.yml'
      - 'tools/qo_isolated_runner.py'
      - 'tools/qo_mech_01.py'
      - 'research/qo-mech-01-protocol.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            data/ZL3b-n.txt
            tools/qo_isolated_runner.py
            tools/qo_rival_calibration.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hash source and isolate training-only pages
        run: python tools/qo_isolated_runner.py prepare
      - name: Archive protected-data-free input and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qo-training-only-input
          path: training-snapshot/
          if-no-files-found: warn
          retention-days: 14
  analyze:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/qo_isolated_runner.py
            tools/qo_rival_calibration.py
            tools/qo_rival_circular_shift.py
            tools/qo_mech_01.py
            research/qo-mech-01-protocol.md
            tests/test_qo_rival.py
            research/qo-rival-protocol.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify existing qo parser regression fixtures
        run: python -m unittest discover -s tests -p 'test_qo_rival.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: qo-training-only-input
          path: training-snapshot/
      - name: Replay qo rivalry and circular-shift control twice
        run: python tools/qo_isolated_runner.py analyze
      - name: QO-MECH-01 two-direction predictive test and deterministic replay
        run: python tools/qo_mech_01.py
      - name: Archive executed results, parameters and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qo-isolated-results
          path: research-output/
          if-no-files-found: warn
          retention-days: 30
