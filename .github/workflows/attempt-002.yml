name: Attempt 002 reproducibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'attempts/002-currier-header-interaction/**'
      - '.github/workflows/attempt-002.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Re-run with locked inputs
        run: |
          python attempts/002-currier-header-interaction/run.py \
            --corpus experiments/line-memory/experiment/inputs/ZL3b-n.txt \
            --parser experiments/line-memory/experiment/inputs/ivtff_parser_rc1_2.py \
            --one attempts/001-paragraph-header-key/run.py \
            --out /tmp/attempt-002-results.json
      - name: Compare parsed scientific results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('attempts/002-currier-header-interaction/results.json').read_text())
          actual=json.loads(Path('/tmp/attempt-002-results.json').read_text())
          assert expected==actual, 'RESULTS DIFFER'
          print('PASS: scientific output identical')
          PY
