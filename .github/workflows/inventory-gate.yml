name: Inventory gate isolated tests
on:
  push:
    branches:
      - experiment/anchor01-safe-inventory-20261115
    paths:
      - 'tools/verified_inventory.py'
      - 'tests/test_verified_inventory.py'
      - '.github/workflows/inventory-gate.yml'
  pull_request:
    paths:
      - 'tools/verified_inventory.py'
      - 'tests/test_verified_inventory.py'
      - '.github/workflows/inventory-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test inventory gate without opening original corpora or holdout
        run: python -m unittest discover -s tests -p 'test_verified_inventory.py' -v
