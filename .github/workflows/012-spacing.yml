name: 012 isolated spacing rival
on:
  pull_request:
    branches: [attempt-011]
    paths:
      - 'attempts/012-hardcore-qo-spacing/**'
      - 'tools/prepare_012.py'
      - 'tools/audit_012_trace.py'
      - '.github/workflows/012-spacing.yml'
  workflow_dispatch:
jobs:
  spacing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: Trusted prepare of training-only IT2a
        run: python tools/prepare_012.py "$RUNNER_TEMP/training-only" IT2a-n.txt
      - name: Audited model execution
        env:
          VOYNICH_DATA_DIR: ${{ runner.temp }}/training-only
        run: |
          strace -f -qq -e trace=open,openat,openat2,readlink,readlinkat -s 4096 -o "$RUNNER_TEMP/012.trace" python attempts/012-hardcore-qo-spacing/run.py
          python tools/audit_012_trace.py "$RUNNER_TEMP/012.trace"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ci-012
          path: results_ci_012.json
          if-no-files-found: ignore
