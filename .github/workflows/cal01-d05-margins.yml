name: CAL-01 D05 margins only
on:
  push:
    branches: [research/cal01-diagnostic-20261125]
    paths: [.github/workflows/cal01-d05-margins.yml]
permissions:
  contents: read
  actions: read
jobs:
  margins:
    if: github.run_attempt == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 80e874a0ffe057c8a458f815bbbd267a085c45a9
          sparse-checkout: canonical
      - uses: actions/checkout@v4
        with:
          path: original
          ref: b85416e36c91cdcf126557fc26ded3e7c6cf6bfa
          sparse-checkout-cone-mode: false
          sparse-checkout: /cal01-actions-input.zip
      - uses: actions/checkout@v4
        with:
          path: frozen
          ref: 0fb8b0ddb2ab1281758834e501f166669646518e
          sparse-checkout: experiments/VOY-REFLOW-CAL-01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify reviewed code and procedural pins before archive retrieval
        run: |
          echo 'eb69abd8b40e97a70ec854d160e837f740688067f9d71a440a82fab7d1c76ed0  candidate/canonical/aggregation/aggregate_d05.py' | sha256sum -c -
          python - <<'PY'
          import sys, pathlib, argparse
          base=pathlib.Path('candidate/canonical/aggregation')
          sys.path.insert(0,str(base))
          import aggregate_d05 as m
          m.sources(argparse.Namespace(index=base/'INPUT_INDEX.json',reference=base.parent/'reference.json',frozen=pathlib.Path('frozen/experiments/VOY-REFLOW-CAL-01'),split_receipt=base/'SPLIT_INTEGRITY_RECEIPT.json',review=base/'SOURCE_REVIEW.json'))
          print('Procedural source gate PASS')
          PY
      - name: Retrieve pinned archives as opaque ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir archives
          python - <<'PY'
          import json, pathlib, subprocess, hashlib
          index=json.loads(pathlib.Path('candidate/canonical/aggregation/INPUT_INDEX.json').read_text())
          for e in index['artifacts']:
              p=pathlib.Path('archives')/f"{e['artifact_id']}.zip"
              with p.open('xb') as f:
                  subprocess.run(['gh','api',f"repos/Superb0b0/voynich-entropy-lab/actions/artifacts/{e['artifact_id']}/zip"],stdout=f,check=True)
              if hashlib.sha256(p.read_bytes()).hexdigest()!=e['archive_sha256']:
                  raise RuntimeError('archive digest mismatch')
          print('40 pinned archives retrieved')
          PY
      - name: Retrieve and verify original qualification receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Superb0b0/voynich-entropy-lab/actions/artifacts/15124911403/zip > qualification.zip
          echo 'fba1ffca94a7a72027d5a01862925090a5c0def6ecdea770ddd86956805b8a80  qualification.zip' | sha256sum -c -
          unzip -p qualification.zip qualification.json > qualification.json
          python -m pip install --only-binary=:all: --require-hashes -r candidate/canonical/wheels.txt
      - name: Run approved margins phase in admitted D05 environment
        env:
          OPENBLAS_CORETYPE: Haswell
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
        run: |
          unset NPY_ENABLE_CPU_FEATURES
          python candidate/canonical/aggregation/aggregate_d05.py margins --frozen frozen/experiments/VOY-REFLOW-CAL-01 --archives archives --checkpoint-package original/cal01-actions-input.zip --review candidate/canonical/aggregation/SOURCE_REVIEW.json --qualification qualification.json --out margins.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal01-margins-${{ github.run_id }}
          path: margins.json
          if-no-files-found: warn
