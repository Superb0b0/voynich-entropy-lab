name: W47 independent synthetic runner oracle
on:
  pull_request:
    paths:
      - 'research/week47-qo-decision/runner_oracle_audit.py'
      - 'research/week47-qo-decision/run_locked.py'
      - '.github/workflows/week47-runner-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/week47-qo-decision/runner_oracle_audit.py
            research/week47-qo-decision/run_locked.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no corpus, holdout, or original data is mounted
        run: |
          set -euo pipefail
          test ! -e HOLDOUT.md
          test ! -e data/ZL3b-n.txt
          test ! -e data/IT2a-n.txt
          test ! -d training-snapshot
      - name: Compare runner Monte Carlo with closed-form expectation on fake data
        run: |
          set -euo pipefail
          python research/week47-qo-decision/runner_oracle_audit.py \
            --runner research/week47-qo-decision/run_locked.py \
            --output research-output/w47-synthetic-oracle.json
      - uses: actions/upload-artifact@v4
        with:
          name: w47-synthetic-runner-oracle
          path: research-output/w47-synthetic-oracle.json
          if-no-files-found: error
          retention-days: 14
