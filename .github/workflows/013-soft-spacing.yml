name: 013 isolated soft-spacing comparison
on:
  pull_request:
    branches: [attempt-012]
    paths:
      - 'attempts/013-soft-spacing/**'
      - '.github/workflows/013-soft-spacing.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: Trusted preparation
        run: |
          python tools/prepare_012.py "$RUNNER_TEMP/training-only" ZL3b-n.txt
          python tools/prepare_012.py "$RUNNER_TEMP/training-only" IT2a-n.txt
      - name: Audited 013 training and comparison
        env:
          VOYNICH_DATA_DIR: ${{ runner.temp }}/training-only
        run: |
          strace -f -qq -e trace=open,openat,openat2,readlink,readlinkat -s 4096 -o "$RUNNER_TEMP/013.trace" python attempts/013-soft-spacing/run.py
          python tools/audit_012_trace.py "$RUNNER_TEMP/013.trace"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ci-013
          path: results_ci_013.json
          if-no-files-found: ignore
