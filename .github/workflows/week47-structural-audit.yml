name: W47 structural parser audit (no scientific test)
on:
  pull_request:
    paths:
      - 'research/week47-qo-decision/structural_audit.py'
      - '.github/workflows/week47-structural-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            data/ZL3b-n.txt
            data/IT2a-n.txt
            experiments/line-memory/experiment/inputs/ivtff_parser_rc1_2.py
            research/week47-qo-decision/structural_audit.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected inventory is absent
        run: |
          set -euo pipefail
          test ! -e HOLDOUT.md
          test -f data/ZL3b-n.txt
          test -f data/IT2a-n.txt
      - name: Read-only RC1.2 per-locus and IVTFF block integrity audit
        run: |
          set -euo pipefail
          python research/week47-qo-decision/structural_audit.py \
            --zl3b data/ZL3b-n.txt \
            --it2a data/IT2a-n.txt \
            --parser experiments/line-memory/experiment/inputs/ivtff_parser_rc1_2.py \
            --out research-output/w47-structural-audit.json
      - name: Archive aggregate-only structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w47-structural-audit
          path: research-output/w47-structural-audit.json
          if-no-files-found: warn
          retention-days: 14
