name: Synthetic strace audit regression
on:
  push:
    branches:
      - research/verify-chdir-regression-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier import dependency
        run: python -m pip install PyYAML
      - name: Run synthetic regression without corpus inputs
        run: python -m unittest discover -s tests -p 'test_verify_chdir_regression.py' -v
