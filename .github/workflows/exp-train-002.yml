name: EXP-TRAIN-002 paragraph control
on:
  pull_request:
    paths:
      - research/exp_train_002.py
      - research/EXP-TRAIN-002-PROTOCOL.md
      - .github/workflows/exp-train-002.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paragraph-preserving control
        run: |
          umask 077
          python research/exp_train_002.py
