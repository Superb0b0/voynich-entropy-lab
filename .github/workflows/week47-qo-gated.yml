name: W47 qo null-only gated experiment
on:
  pull_request:
    paths:
      - 'research/week47-qo-decision/**'
      - '.github/workflows/week47-qo-gated.yml'
      - 'tests/test_week47_preflight.py'
      - 'research/week47-qo-decision/synthetic_adjacency_fixture.py'
  workflow_dispatch:
    inputs:
      run_experiment:
        type: boolean
        default: false
        required: true
        description: 'Acknowledged exploratory run, ONLY if all provenances are frozen'
permissions:
  contents: read
concurrency:
  group: week47-qo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed guard with synthetic fixtures
        run: python -m unittest discover -s tests -p 'test_week47_preflight.py' -v
      - name: Check synthetic physical adjacency and permutation regressions
        run: python research/week47-qo-decision/synthetic_adjacency_fixture.py -v
      - name: Assert real preflight rejects missing parser evidence
        run: |
          set -euo pipefail
          if python research/week47-qo-decision/preflight.py 2> /tmp/preflight_err; then
            echo 'ERROR: incomplete scientific protocol was unexpectedly permitted'
            exit 1
          fi
          grep -q 'Parser parity evidence PENDING' /tmp/preflight_err
          echo 'PASS: missing parser evidence caused an automatic refusal'
  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: gate
        name: Enforce preceding frozen commit, parser parity, question and isolation
        run: |
          set -euo pipefail
          python research/week47-qo-decision/preflight.py
          echo 'ready=true' >> "$GITHUB_OUTPUT"
  experiment:
    if: github.event_name == 'workflow_dispatch' && inputs.run_experiment == true && needs.preflight.outputs.ready == 'true'
    needs: [guard-tests, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/week47-qo-decision/
          sparse-checkout-cone-mode: false
      - name: Run only pre-attested isolated runner
        run: |
          set -euo pipefail
          test ! -e HOLDOUT.md
          test ! -e data/ZL3b-n.txt
          test ! -e data/IT2a-n.txt
          python research/week47-qo-decision/run_locked.py
