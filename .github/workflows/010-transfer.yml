name: 010 frozen M2 transfer to IT2a
on:
  pull_request:
    branches: [attempt-009]
    paths:
      - 'attempts/010-cross-transcription/**'
      - '.github/workflows/010-transfer.yml'
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python attempts/010-cross-transcription/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ci-010
          path: results_ci_010.json
          if-no-files-found: ignore
